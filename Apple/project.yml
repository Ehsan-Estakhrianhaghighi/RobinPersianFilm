name: RobinPersianFilmApple
options:
  bundleIdPrefix: com.robinpersianfilm
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: RobinPersianFilm
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.14.3
targets:
  RobinPersianFilmTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinpersianfilm.appletv
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - package: SwiftSoup
  RobinPersianFilmIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinpersianfilm.iphone
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - package: SwiftSoup
